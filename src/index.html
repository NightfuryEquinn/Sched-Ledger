    <title>Sched Ledger — Private, encrypted expense ledger and schedule</title>
    <meta
      name="description"
      content="Sched Ledger is a private expense ledger, schedule, and to-do app. Track spending across wallets and 29 currencies, plan bills with email and push reminders, and sign in with a Web3 wallet — no email or password required."
    />
    <link rel="canonical" href="https://sched-ledger.vercel.app/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <script>
      (function () {
        var pref = localStorage.getItem("ledger:theme");
        var dark =
          pref === "dark" ||
          (pref !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
