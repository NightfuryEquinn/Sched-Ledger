<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
  Source for the 1200x630 social share card (og:image / twitter:image).

  Regenerate after editing:

    /opt/pw-browsers/chromium --headless --disable-gpu --no-sandbox --hide-scrollbars \
      --force-device-scale-factor=1 --window-size=1200,630 \
      --screenshot=website/og-image.png scripts/og-image.html
    cp website/og-image.png public/og-image.png

  (Any headless Chrome/Chromium works; the path above is the one bundled with Playwright.)
  The logo is read from ../website/logo.png, so run the command from the repository root.
  Webfonts come from Google Fonts, so the render needs network access; without it the card
  falls back to Georgia / system-ui and the type will not match the site.
-->
    <link
      href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;600;700&family=Young+Serif&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        background: #0b0d12;
        color: #e8eaf0;
        font-family: "Schibsted Grotesk", system-ui, sans-serif;
        letter-spacing: 0.015em;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 78px;
      }
      .glow {
        position: absolute;
        top: -260px;
        left: 50%;
        transform: translateX(-50%);
        width: 1100px;
        height: 900px;
        background: radial-gradient(
          circle,
          rgba(110, 231, 183, 0.16),
          rgba(124, 154, 255, 0.12) 42%,
          transparent 70%
        );
      }
      .frame {
        position: absolute;
        inset: 22px;
        border: 1px solid #242938;
        border-radius: 22px;
      }
      .inner {
        position: relative;
        z-index: 2;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 26px;
      }
      .brand img {
        width: 56px;
        height: 56px;
        border-radius: 14px;
      }
      .brand span {
        font-family: "Young Serif", Georgia, serif;
        font-size: 34px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 8px 18px;
        border: 1px solid #242938;
        border-radius: 999px;
        font-size: 16px;
        color: #9aa1b4;
        background: #12151d;
        margin-bottom: 22px;
      }
      .badge .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #6ee7b7;
      }
      h1 {
        font-family: "Young Serif", Georgia, serif;
        font-weight: 400;
        font-size: 62px;
        line-height: 1.1;
        letter-spacing: -0.01em;
        max-width: 960px;
      }
      h1 .grad {
        background: linear-gradient(90deg, #6ee7b7, #7c9aff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p.sub {
        color: #9aa1b4;
        font-size: 23px;
        margin-top: 20px;
        max-width: 850px;
        line-height: 1.42;
      }
      .strip {
        display: flex;
        gap: 11px;
        margin-top: 30px;
        flex-wrap: wrap;
      }
      .strip span {
        padding: 8px 16px;
        border: 1px solid #242938;
        border-radius: 10px;
        background: #12151d;
        color: #9aa1b4;
        font-size: 16px;
        font-family: "Azeret Mono", ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="frame"></div>
    <div class="inner">
      <div class="brand"><img src="../website/logo.png" alt="" />Sched Ledger</div>
      <div class="badge">
        <span class="dot"></span>End-to-end encrypted · Web3 sign-in · No email or password
      </div>
      <h1>Your money and schedule,<br /><span class="grad">encrypted end-to-end.</span></h1>
      <p class="sub">
        A private expense ledger, schedule, and to-do app. 29 currencies, bill reminders, savings
        goals — the server only ever sees ciphertext.
      </p>
      <div class="strip">
        <span>Bun</span><span>Hono</span><span>MongoDB</span><span>React 19</span
        ><span>AES-256-GCM</span><span>PWA</span>
      </div>
    </div>
  </body>
</html>
